[project]
name = "quantinsight-backend"
version = "0.1.0"
description = "FastAPI backend for QuantInsight MVP."
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "pydantic-settings==2.7.1",
  "SQLAlchemy==2.0.36",
  "asyncpg==0.30.0",
  "redis==5.2.1",
  "alembic==1.14.0",
  "python-multipart==0.0.20",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
